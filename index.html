<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>MamboSon — Academia de salsa</title>
    <meta name="description" content="Academia, comunidad y familia. Clases de salsa para todos los niveles, clases online, eventos sociales y tienda oficial de MamboSon." />
    <meta name="theme-color" content="#cd1719" />

    <!-- Open Graph / social (WhatsApp es el canal principal de compartir) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="MamboSon" />
    <meta property="og:title" content="MamboSon" />
    <meta property="og:description" content="Academia, comunidad y familia. Clases de salsa para todos los niveles, clases online, eventos sociales y tienda oficial de MamboSon." />
    <meta property="og:url" content="https://mambosondance.com" />
    <meta property="og:image" content="https://mambosondance.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fuentes: siempre con <link>, nunca @import dentro del SCSS inyectado -->
    <!-- La foto del hero es el LCP del home -->
    <link rel="preload" href="/img/foto-1.jpg" as="image" />
    <link rel="preload" href="/fonts/BalginDisplay-Bold.otf" as="font" type="font/otf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Free por CDN; iconos como <i class="fa-solid fa-…"> -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
